      <path d="M-8-35H-4V-30H-8ZM4-35H8V-30H4Z" fill="#7ee7cf" />
      <path d="M-12-19H12V-16H15V-7H11V-3H-11V-7H-15V-16H-12Z" fill="#8d9fb7" />
