<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="832" height="170" viewBox="0 0 832 170" role="img" aria-labelledby="title description">
  <title id="title">Strawberry Express</title>
  <desc id="description">A little delivery robot carries a strawberry, drops it, chases it down, and finally delivers it to a crate. The animation repeats every eighteen seconds.</desc>
